# Nginx Virtual Host Configuration for Brew & Bloom Café on Azure Linux VM
# Place in: /etc/nginx/sites-available/brew-and-bloom
# Link to:  /etc/nginx/sites-enabled/brew-and-bloom

server {
    listen 80;
    server_name your-domain.com www.your-domain.com YOUR_AZURE_PUBLIC_IP;

    # Redirect all HTTP traffic to HTTPS (uncomment after obtaining Certbot SSL)
    # return 301 https://$host$request_uri;

    # Max upload file size for images
    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Frontend React Static Files
    location / {
        root /var/www/brew-and-bloom/frontend/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # Backend Express API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

